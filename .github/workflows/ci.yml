name: CASE//ZERO CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read


concurrency:
  group: case-zero-ci-${{ github.ref }}
  cancel-in-progress: true


jobs:

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      POSTGRES_USER: casezero
      POSTGRES_PASSWORD: casezero-test-password
      POSTGRES_DB: casezero_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_USER: casezero
          POSTGRES_PASSWORD: casezero-test-password
          POSTGRES_DB: casezero_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U casezero -d casezero_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Migrate test database
        working-directory: backend
        run: alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -v

      - name: Prove offline detection regression
        working-directory: backend
        run: python -m app.services.replay_regression_proof

      - name: Export offline detection proof
        working-directory: backend
        shell: bash
        run: |
          staging_dir=$(mktemp -d "$RUNNER_TEMP/case-zero-proof.XXXXXXXX")
          proof_dir="$staging_dir/bundle"
          python -m app.services.replay_proof_export --output-dir "$proof_dir"
          printf 'PROOF_DIR=%s\n' "$proof_dir" >> "$GITHUB_ENV"

      - name: Independently verify detection proof
        working-directory: backend
        shell: bash
        run: python -m app.services.replay_proof_verify --bundle-dir "$PROOF_DIR"

      - name: Check proof artifact staging
        shell: bash
        run: |
          python - <<'PY'
          import os
          import stat
          from pathlib import Path

          directory = Path(os.environ["PROOF_DIR"])
          if not stat.S_ISDIR(directory.lstat().st_mode):
              raise SystemExit("Proof staging must be a real directory.")

          expected = {"proof.json", "proof.md"}
          if {entry.name for entry in directory.iterdir()} != expected:
              raise SystemExit("Proof staging must contain exactly proof.json and proof.md.")

          for name in sorted(expected):
              info = (directory / name).lstat()
              if not stat.S_ISREG(info.st_mode) or not 0 < info.st_size <= 16 * 1024:
                  raise SystemExit(f"Invalid proof artifact: {name}.")
          print("Proof artifact staging passed.")
          PY

      - name: Upload verified detection proof
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: case-zero-detection-proof
          path: |
            ${{ env.PROOF_DIR }}/proof.json
            ${{ env.PROOF_DIR }}/proof.md
          if-no-files-found: error
          retention-days: 7
          overwrite: false


  replay-persistence-tests:
    name: Replay Persistence (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APP_ENV: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "55432"
      POSTGRES_DB: casezero_test
      POSTGRES_USER: casezero_local_test
      POSTGRES_PASSWORD: casezero-local-test-only
      CASE_ZERO_RUN_V26G_INTEGRATION: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Provision disposable PostgreSQL
        id: provision
        shell: bash
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          if compgen -e | grep -E '^(DOCKER_|COMPOSE_|PG|DATABASE_URL)' >/dev/null; then
            echo 'Unexpected environment overrides.' >&2
            exit 1
          fi
          docker_endpoint=$(docker context inspect default --format '{{.Endpoints.docker.Host}}')
          test "$(docker context show)" = default
          test "$docker_endpoint" = unix:///var/run/docker.sock
          test -S /var/run/docker.sock
          engine=$(docker --context default info --format '{{.OSType}}/{{.OperatingSystem}}')
          [[ "$engine" == 'linux/Ubuntu '* ]]

          project=case-zero-v26g-test
          compose=(docker --context default compose --env-file compose.test.env \
            --project-name "$project" --file compose.test.yaml)
          containers=$(docker --context default ps -aq --filter "label=com.docker.compose.project=$project")
          networks=$(docker --context default network ls -q --filter "label=com.docker.compose.project=$project")
          listeners=$(ss -H -ltn 'sport = :55432')
          test -z "$containers" && test -z "$networks" && test -z "$listeners" || exit 1

          "${compose[@]}" config --quiet
          "${compose[@]}" create postgres-test
          container_id=$(docker --context default container inspect --format '{{.Id}}' "$project-postgres-test-1")
          network_id=$(docker --context default network inspect --format '{{.Id}}' "${project}_default")
          [[ "$container_id" =~ ^[0-9a-f]{64}$ && "$network_id" =~ ^[0-9a-f]{64}$ ]]
          printf 'container_id=%s\nnetwork_id=%s\n' "$container_id" "$network_id" >> "$GITHUB_OUTPUT"
          "${compose[@]}" start --wait --wait-timeout 120 postgres-test

      - name: Run all nine replay persistence integration tests
        working-directory: backend
        shell: bash
        run: |
          report="$RUNNER_TEMP/replay-persistence-junit.xml"
          python -m pytest -q --noconftest --junitxml="$report" tests/test_replay_run_store.py
          python - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          cases = ET.parse(sys.argv[1]).findall(".//testcase")
          if len(cases) != 9 or any(
              case.find(mark) is not None
              for case in cases
              for mark in ("skipped", "failure", "error")
          ):
              raise SystemExit("Expected nine passing persistence tests and zero skips.")
          print("Verified all nine persistence tests passed without skips.")
          PY

      - name: Remove this job's disposable PostgreSQL resources
        if: ${{ always() && steps.provision.outputs.container_id != '' && steps.provision.outputs.network_id != '' }}
        shell: bash
        env:
          TEST_CONTAINER_ID: ${{ steps.provision.outputs.container_id }}
          TEST_NETWORK_ID: ${{ steps.provision.outputs.network_id }}
        run: |
          [[ "$TEST_CONTAINER_ID" =~ ^[0-9a-f]{64}$ && "$TEST_NETWORK_ID" =~ ^[0-9a-f]{64}$ ]]
          if compgen -e | grep -Ei '^(DOCKER_|COMPOSE_)' >/dev/null; then
            echo 'Unexpected Docker or Compose overrides.' >&2
            exit 1
          fi
          test "$(docker context show)" = default
          test "$(docker context inspect default --format '{{.Endpoints.docker.Host}}')" = unix:///var/run/docker.sock
          test -S /var/run/docker.sock
          project=case-zero-v26g-test
          actual=$(docker --context default container inspect --format \
            '{{.Name}} {{.Config.Image}} {{index .Config.Labels "com.docker.compose.project"}} {{index .Config.Labels "com.docker.compose.service"}}' \
            "$TEST_CONTAINER_ID")
          test "$actual" = "/$project-postgres-test-1 postgres:18 $project postgres-test"
          actual=$(docker --context default network inspect --format \
            '{{.Name}} {{.Driver}} {{index .Labels "com.docker.compose.project"}} {{index .Labels "com.docker.compose.network"}}' \
            "$TEST_NETWORK_ID")
          test "$actual" = "${project}_default bridge $project default"
          docker --context default container rm --force "$TEST_CONTAINER_ID"
          docker --context default network rm "$TEST_NETWORK_ID"


  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    env:
      CASE_ZERO_API_URL: https://case-zero-api-fymf.onrender.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend regression tests
        working-directory: frontend
        run: node --experimental-strip-types --test tests/*.test.mjs

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
