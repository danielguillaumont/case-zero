name: CASE//ZERO CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read


concurrency:
  group: case-zero-ci-${{ github.ref }}
  cancel-in-progress: true


jobs:

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: casezero
      POSTGRES_PASSWORD: casezero-test-password
      POSTGRES_DB: casezero_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_USER: casezero
          POSTGRES_PASSWORD: casezero-test-password
          POSTGRES_DB: casezero_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U casezero -d casezero_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Migrate test database
        working-directory: backend
        run: alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -v


  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build