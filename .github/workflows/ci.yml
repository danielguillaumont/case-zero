name: CASE//ZERO CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read


concurrency:
  group: case-zero-ci-${{ github.ref }}
  cancel-in-progress: true


jobs:

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      POSTGRES_USER: casezero
      POSTGRES_PASSWORD: casezero-test-password
      POSTGRES_DB: casezero_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_USER: casezero
          POSTGRES_PASSWORD: casezero-test-password
          POSTGRES_DB: casezero_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U casezero -d casezero_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Migrate test database
        working-directory: backend
        run: alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -v

      - name: Prove offline detection regression
        working-directory: backend
        run: python -m app.services.replay_regression_proof

      - name: Export offline detection proof
        working-directory: backend
        shell: bash
        run: |
          staging_dir=$(mktemp -d "$RUNNER_TEMP/case-zero-proof.XXXXXXXX")
          proof_dir="$staging_dir/bundle"
          python -m app.services.replay_proof_export --output-dir "$proof_dir"
          printf 'PROOF_DIR=%s\n' "$proof_dir" >> "$GITHUB_ENV"

      - name: Independently verify detection proof
        working-directory: backend
        shell: bash
        run: python -m app.services.replay_proof_verify --bundle-dir "$PROOF_DIR"

      - name: Check proof artifact staging
        shell: bash
        run: |
          python - <<'PY'
          import os
          import stat
          from pathlib import Path

          directory = Path(os.environ["PROOF_DIR"])
          if not stat.S_ISDIR(directory.lstat().st_mode):
              raise SystemExit("Proof staging must be a real directory.")

          expected = {"proof.json", "proof.md"}
          if {entry.name for entry in directory.iterdir()} != expected:
              raise SystemExit("Proof staging must contain exactly proof.json and proof.md.")

          for name in sorted(expected):
              info = (directory / name).lstat()
              if not stat.S_ISREG(info.st_mode) or not 0 < info.st_size <= 16 * 1024:
                  raise SystemExit(f"Invalid proof artifact: {name}.")
          print("Proof artifact staging passed.")
          PY

      - name: Upload verified detection proof
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: case-zero-detection-proof
          path: |
            ${{ env.PROOF_DIR }}/proof.json
            ${{ env.PROOF_DIR }}/proof.md
          if-no-files-found: error
          retention-days: 7
          overwrite: false


  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    env:
      CASE_ZERO_API_URL: https://case-zero-api-fymf.onrender.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend regression tests
        working-directory: frontend
        run: node --experimental-strip-types --test tests/*.test.mjs

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
