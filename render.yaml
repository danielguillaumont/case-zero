# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: case-zero-api
    runtime: python
    plan: free
    region: ohio
    rootDir: backend

    buildCommand: pip install -r requirements.txt

    startCommand: >-
      alembic upgrade head &&
      uvicorn app.main:app
      --host 0.0.0.0
      --port $PORT

    autoDeployTrigger: off

    envVars:
      - key: APP_ENV
        value: production

      - key: PYTHON_VERSION
        value: 3.12.2

      # Production PostgreSQL is hosted on Neon.
      # Values are configured manually in the Render dashboard.
      - key: POSTGRES_USER
        sync: false

      - key: POSTGRES_PASSWORD
        sync: false

      - key: POSTGRES_DB
        sync: false

      - key: POSTGRES_HOST
        sync: false

      - key: POSTGRES_PORT
        sync: false

      - key: JWT_SECRET_KEY
        generateValue: true

      - key: JWT_ACCESS_TOKEN_MINUTES
        value: "60"

      - key: LOGIN_THROTTLE_MAX_FAILURES
        value: "5"

      - key: LOGIN_THROTTLE_WINDOW_MINUTES
        value: "15"

      - key: LOGIN_THROTTLE_BLOCK_MINUTES
        value: "5"

      - key: CASE_ZERO_API_DOCS_ENABLED
        value: "false"

      - key: CASE_ZERO_ALLOWED_HOSTS
        fromService:
          type: web
          name: case-zero-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME